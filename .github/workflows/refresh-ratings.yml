name: Refresh IMDB Ratings

on:
  schedule:
    - cron: '0 6 * * *'   # Daily 6 AM UTC
  workflow_dispatch:

concurrency:
  group: refresh-ratings
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scrape IMDB ratings
        env:
          IMDB_PROFILE_ID: ${{ vars.IMDB_PROFILE_ID }}
        run: python scripts/scrape_imdb.py --output scripts/scraped-ratings.json

      - name: Build data.js
        run: python scripts/build_data.py --input scripts/scraped-ratings.json --output assets/js/data.js

      - name: Scrape IMDB watchlist
        env:
          IMDB_PROFILE_ID: ${{ vars.IMDB_PROFILE_ID }}
        run: python scripts/scrape_imdb_watchlist.py --output scripts/scraped-watchlist.json

      - name: Build watchlist-data.js
        run: python scripts/build_watchlist.py --input scripts/scraped-watchlist.json --ratings scripts/scraped-ratings.json --output assets/js/watchlist-data.js

      - name: Build upcoming-data.js
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python scripts/build_upcoming.py --input scripts/scraped-ratings.json --watchlist scripts/scraped-watchlist.json

      - name: Validate IMDb links in static HTML
        continue-on-error: true
        run: python scripts/validate_html_imdb_links.py --strict

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/js/data.js assets/js/watchlist-data.js assets/js/upcoming-data.js index.html "pages/*.html" scripts/wikidata-language-cache.json scripts/upcoming-editorial.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          MSG="chore: refresh ratings data $(date -u +%Y-%m-%d)"
          git commit -m "$MSG"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --soft origin/main
            if git diff --cached --quiet; then
              echo "Remote already contains this refresh"
              exit 0
            fi
            git commit -m "$MSG"
            git push origin HEAD:main && exit 0
            echo "Push attempt $attempt failed; retrying in ${attempt}0s..."
            sleep $((attempt * 10))
          done
          echo "Push failed after 3 attempts"
          exit 1
